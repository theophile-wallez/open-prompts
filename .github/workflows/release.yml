name: Release

# Publishes to npm when a version tag is pushed, through npm trusted publishing:
# no npm token is stored, and npm attaches a provenance statement to the package.
# See RELEASING.md for the one-time setup on npmjs.com.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow through OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caches in release builds
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1);
          ' "$(npm --version)" || npm install --global npm@11
          npm --version
      - name: The tag matches the version
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm publish

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
